[build]
  publish = "."
  # Recuit le contenu Supabase dans le filet de secours de chaque page.
  # Sans ce script, jbe-content-cache reste vide et le site perd tout le
  # contenu saisi par JB des que Supabase ne repond pas.
  # Le script sort toujours en code 0 : une publication ne doit jamais etre
  # bloquee par une indisponibilite de Supabase.
  command = "node outil-dev/build-cache.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Pages masquées : le site se limite au karting (9 octobre 2026) ──
# Rien ne mène plus à ces pages (theme.css section 5), mais elles restent
# en ligne pour qui a l'adresse. noindex les retire des moteurs de recherche
# sans les bloquer : un robot doit pouvoir lire l'en-tête pour l'appliquer,
# c'est pourquoi robots.txt ne les interdit pas.
# Pour réafficher une page : retirer son bloc ici, sa ligne dans theme.css,
# et la remettre dans sitemap.xml.
[[headers]]
  for = "/coaching.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/evenements.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/evenements"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/evenements/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/evenement.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/events.html"
